<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHOSE HOUSE — متجر الأحذية</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    /* ------------------ Header ------------------ */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #111;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 2px;
    }

    .cart-btn {
      background: #fff;
      color: #000;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* ------------------ Hero ------------------ */
    .hero {
      background: url('https://i.imgur.com/oYiTqum.jpeg') center/cover no-repeat;
      height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 70px;
    }

    .hero h2 {
      font-size: 48px;
      color: #fff;
      background: rgba(0,0,0,0.6);
      padding: 20px 40px;
      border-radius: 10px;
    }

    /* ------------------ Slider ------------------ */
    .slider {
      margin: 40px auto;
      width: 90%;
      overflow: hidden;
      border-radius: 10px;
    }

    .slides {
      display: flex;
      width: 300%;
      animation: slide 9s infinite;
    }

    .slides img {
      width: 100%;
    }

    @keyframes slide {
      0% { transform: translateX(0); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(0); }
    }

    /* ------------------ Products ------------------ */
    .products {
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ------------------ Footer ------------------ */
    footer {
      background: #111;
      color: #fff;
      padding: 20px;
      margin-top: 50px;
      text-align: center;
    }

    /* ------------------ Cart Modal ------------------ */
    .cart-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .cart-box {
      background: #fff;
      width: 350px;
      padding: 20px;
      border-radius: 10px;
    }

    .close-cart {
      float: left;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SHOSE HOUSE</h1>
    <div class="cart-btn" onclick="openCart()">السلة 🛒</div>
  </header>

  <div class="hero">
    <h2>أفضل الأحذية — جودة وفخامة</h2>
  </div>

  <div class="slider">
    <div class="slides">
      <img src="https://i.imgur.com/5rY9Z9y.jpeg" />
      <img src="https://i.imgur.com/NcQ2ywk.jpeg" />
      <img src="https://i.imgur.com/OKw5tFZ.jpeg" />
    </div>
  </div>

  <section class="products">

    <div class="product">
      <img src="https://i.imgur.com/5rY9Z9y.jpeg">
      <h3>حذاء رياضي فاخر</h3>
      <p>السعر: 120 ريال</p>
      <button onclick="addToCart('حذاء رياضي فاخر', 120)">أضف للسلة</button>
    </div>

    <div class="product">
      <img src="https://i.imgur.com/NcQ2ywk.jpeg">
      <h3>حذاء كلاسيكي</h3>
      <p>السعر: 150 ريال</p>
      <button onclick="addToCart('حذاء كلاسيكي', 150)">أضف للسلة</button>
    </div>

    <div class="product">
      <img src="https://i.imgur.com/OKw5tFZ.jpeg">
      <h3>حذاء مريح يومي</h3>
      <p>السعر: 90 ريال</p>
      <button onclick="addToCart('حذاء مريح يومي', 90)">أضف للسلة</button>
    </div>

  </section>

  <footer>
    © 2025 — SHOSE HOUSE
  </footer>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-box">
      <div class="close-cart" onclick="closeCart()">✖</div>
      <h3>سلة المشتريات</h3>
      <div id="cartItems"></div>
      <hr>
      <p>الإجمالي: <span id="totalPrice">0</span> ريال</p>
    </div>
  </div>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      alert('تمت الإضافة إلى السلة!');
      updateCart();
    }

    function openCart() {
      document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function updateCart() {
      let itemsDiv = document.getElementById('cartItems');
      let total = 0;
      itemsDiv.innerHTML = '';

      cart.forEach(item => {
        itemsDiv.innerHTML += `<p>${item.name} — ${item.price} ريال</p>`;
        total += item.price;
      });

      document.getElementById('totalPrice').innerText = total;
    }
  </script>

</body>
</html>
